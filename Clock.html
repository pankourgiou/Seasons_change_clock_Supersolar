<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supersolar Clock</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: url("Seasons_Change_Supersolar.jpg") no-repeat center center;
        background-size: contain;        /* Entire image visible */
        background-color: black;
        display: flex;
        justify-content: flex-end;       /* Right side */
        align-items: center;
        padding-right: 7vw;              /* Proper spacing from edge */
        font-family: "Georgia", serif;
    }

    .clock {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        position: relative;
        border: 2px solid rgba(120, 220, 255, 0.6);
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        box-shadow: 
            0 0 20px rgba(0, 220, 255, 0.3),
            inset 0 0 30px rgba(0, 220, 255, 0.15);
    }

    .number {
        position: absolute;
        width: 100%;
        height: 100%;
        text-align: center;
        transform: rotate(var(--rotation));
        font-size: 17px;
        color: #c9f6ff;
        text-shadow: 0 0 8px rgba(0, 220, 255, 0.9);
        letter-spacing: 1px;
    }

    .number span {
        display: inline-block;
        transform: rotate(calc(-1 * var(--rotation)));
    }

    /* Slight stylistic variation */
    .number:nth-child(3n) span {
        font-style: italic;
        opacity: 0.85;
    }

    .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform-origin: bottom;
        transform: translateX(-50%) rotate(0deg);
        border-radius: 4px;
    }

    .hour {
        width: 4px;
        height: 70px;
        background: #e6fbff;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    }

    .minute {
        width: 3px;
        height: 105px;
        background: #bdf3ff;
        box-shadow: 0 0 8px rgba(0, 200, 255, 0.7);
    }

    .second {
        width: 2px;
        height: 115px;
        background: #66eaff;
        opacity: 0.9;
    }

    .center-dot {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #e6fbff;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.9);
    }
</style>
</head>

<body>

<div class="clock" id="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center-dot"></div>
</div>

<script>
    const clock = document.getElementById("clock");

    // Create numbers dynamically
    for (let i = 1; i <= 12; i++) {
        const number = document.createElement("div");
        number.classList.add("number");
        number.style.setProperty("--rotation", i * 30 + "deg");

        const span = document.createElement("span");
        span.textContent = i;

        number.appendChild(span);
        clock.appendChild(number);
    }

    function setClock() {
        const now = new Date();

        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours() % 12;

        const secondDeg = seconds * 6;
        const minuteDeg = minutes * 6 + seconds * 0.1;
        const hourDeg = hours * 30 + minutes * 0.5;

        document.getElementById("second").style.transform =
            `translateX(-50%) rotate(${secondDeg}deg)`;

        document.getElementById("minute").style.transform =
            `translateX(-50%) rotate(${minuteDeg}deg)`;

        document.getElementById("hour").style.transform =
            `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    setInterval(setClock, 1000);
    setClock();
</script>

</body>
</html>
